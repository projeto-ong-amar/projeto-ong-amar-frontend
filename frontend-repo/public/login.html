<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Sistema de Gerenciamento de Estoque</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d5d9e4;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 48px 52px;
    width: 100%;
    max-width: 580px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Logo ── */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 10px;
  }

  .logo-img {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
  }

  /* SVG logo that approximates the Projeto Criança AMAR sketch */
  .logo-svg { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; }

  .brand-title {
    font-size: 22px;
    font-weight: 800;
    color: #2563EB;
    text-align: center;
    margin-top: 14px;
    letter-spacing: -0.01em;
  }

  .brand-sub {
    font-size: 14px;
    color: #6B7280;
    font-weight: 500;
    margin-top: 4px;
    text-align: center;
  }

  /* ── Form ── */
  .form {
    width: 100%;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .field-label {
    font-size: 16px;
    font-weight: 800;
    color: #111827;
    margin-bottom: 10px;
  }

  .field-label + .field-label { margin-top: 28px; }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 18px 20px;
    background: #dde0e8;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    color: #374151;
    outline: none;
    transition: background .2s, box-shadow .2s;
  }

  input[type="email"]::placeholder,
  input[type="password"]::placeholder {
    color: #9CA3AF;
  }

  input[type="email"]:focus,
  input[type="password"]:focus {
    background: #d0d4de;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  .forgot {
    margin-top: 22px;
    font-size: 14px;
    color: #6B7280;
  }

  .forgot a {
    color: #EF4444;
    font-weight: 700;
    text-decoration: none;
  }

  .forgot a:hover { text-decoration: underline; }

  .btn-entrar {
    margin-top: 26px;
    width: 100%;
    padding: 20px;
    background: #2563EB;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
    font-family: 'Nunito', sans-serif;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background .18s, transform .1s;
    box-shadow: 0 4px 16px rgba(37,99,235,0.25);
  }

  .btn-entrar:hover  { background: #1D4ED8; }
  .btn-entrar:active { transform: scale(0.985); }
</style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo-wrap">
<img src="../src/assets/img/pca-1.png" alt="Logo ONG PCA" class="logo-svg">
    <div class="brand-title">Sistema de Gerenciamento de Estoque</div>
    <div class="brand-sub">Alimentos e Produtos de Higiene</div>
  </div>

  <!-- Form -->
  <div class="form">
    <label class="field-label" for="email">Digite seu E-mail</label>
    <input type="email" id="email" placeholder="exemplo@email.com" autocomplete="email"/>

    <label class="field-label" for="senha" style="margin-top:28px;">Digite sua Senha</label>
    <input type="password" id="senha" placeholder="1234" autocomplete="current-password"/>

    <div class="forgot">
      <a href="#">Esqueceu sua senha?</a> ← Clique aqui
    </div>

    <button class="btn-entrar" type="button">Entrar</button>
  </div>

</div>

</body>
</html>
