name: Deploy (reutilizável)

on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      ref:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy em ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.ambiente }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.ambiente }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Definir tag da imagem
        run: echo "IMAGE_TAG=${{ inputs.ambiente }}-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_API_URL é embutida no build, por isso a imagem é gerada por ambiente.
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || '/api' }}
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ inputs.ambiente }}
          cache-to: type=gha,mode=max,scope=${{ inputs.ambiente }}

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin \
             && cd '$DEPLOY_PATH' \
             && touch .env \
             && sed -i '/^FRONTEND_IMAGE_TAG=/d' .env \
             && echo 'FRONTEND_IMAGE_TAG=$IMAGE_TAG' >> .env \
             && docker compose pull frontend \
             && docker compose up -d --no-deps frontend \
             && docker image prune -f"

      - name: Teste de fumaça
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$APP_URL/" > /dev/null
