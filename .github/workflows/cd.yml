name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        required: true
        options: [desenvolvimento, homologacao, producao]
      ref:
        description: "Branch, tag ou SHA a publicar (para promover ou fazer rollback)"
        type: string
        required: true
        default: main

permissions:
   contents: read
   packages: write

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # develop -> desenvolvimento (automático)
  desenvolvimento:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: desenvolvimento
      ref: ${{ github.sha }}
    secrets: inherit

  # main -> homologação (automático) -> produção (exige aprovação no Environment)
  homologacao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: homologacao
      ref: ${{ github.sha }}
    secrets: inherit

  producao:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: homologacao
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: producao
      ref: ${{ github.sha }}
    secrets: inherit

  manual:
    name: Deploy manual
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
    with:
      ambiente: ${{ inputs.ambiente }}
      ref: ${{ inputs.ref }}
    secrets: inherit
