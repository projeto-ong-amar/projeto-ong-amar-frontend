# Frontend (SPA) + proxy reverso da API no mesmo origin (compatível com pca-setup/stack).
# /api/* é repassado ao backend sem o prefixo: /api/csrf -> backend:8080/csrf.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location /assets/ {
    expires 1y;
  }

  # Fallback do SPA: rotas de página (ex.: /redefinir-senha?token=...) caem no index.html.
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
